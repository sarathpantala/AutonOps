[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
timezone = UTC

# max length of characters to apply to the
# "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment file as a
# standalone script, running it in the current process
# for offline mode only
# standalone_mode = false

# enable multiple heads
# multiple_heads = false

# set to 'true' to run in offline mode.
# offline_mode = false

# set to 'true' to use batch mode for SQLite migrations
# batch_mode = false

# set to 'true' to enable logging of SQL statements
# sql_echo = false

# set to 'true' to enable autocommit for DDL statements
# autocommit = false

# enable bracket quoting of identifiers
# quote_identifiers = false

# set to 'true' to disable the migration prompt
# confirm_prompt = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S