[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonops-backend"
version = "0.1.0"
description = "AI SRE Platform Backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.12.0",
    "openai>=1.0.0",
    "tenacity>=8.0.0",
    "kubernetes>=26.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.25.0",
    "passlib[argon2]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]